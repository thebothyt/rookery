<style>
:root{--g:#dde3e8;--p:#f9fafb;--ink:#0f1a24;--mu:#5a6876;--ln:#c6cfd7;--ac:#2540ff;--acl:#e3e7ff;--ok:#1c9a68;--bad:#d4404c;--warn:#dc9a00;--lt:#edf1f5;--dk:#7592b1;--r:22px;
--s:min(calc(100vw - 40px),calc(100dvh - 250px),640px);--hd:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;--bd:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--g);color:var(--ink);font:16px/1.5 var(--bd);min-height:100dvh;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(249,250,251,.7);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid rgba(15,26,36,.09);padding-top:env(safe-area-inset-top)}
.hdin{max-width:1100px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;font:700 21px var(--hd);letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:11px;background:var(--ac);display:grid;place-items:center}.logo svg{width:26px;height:26px}
nav{display:flex;gap:2px;margin-left:10px}
nav button{font:600 15px var(--bd);background:none;border:0;color:var(--mu);padding:8px 14px;border-radius:12px;cursor:pointer;transition:background .15s,color .15s}
nav button:hover{color:var(--ink)}nav button.on{color:var(--ink);background:rgba(15,26,36,.08)}
.back{display:flex;align-items:center;gap:6px;font:600 15px var(--bd);background:rgba(15,26,36,.07);border:0;border-radius:12px;padding:8px 14px 8px 8px;cursor:pointer}
.mepill{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--p);border:1px solid var(--ln);border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer}
.mepill b{font:700 15px var(--hd)}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:hsl(var(--h) 42% 40%);color:#fff;font:700 15px var(--hd)}
.av .ico{width:78%;height:78%}.av.xl{width:84px;height:84px;font-size:32px}
.btn{font:600 15px var(--bd);background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:12px 18px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:background .15s,transform .12s}
.btn:hover{background:#fff}.btn:active{transform:scale(.96)}.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.pri:hover{background:#25364a}.btn.sm{padding:8px 14px;border-radius:12px}
.ic{flex:none}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:26px 18px 60px}
.hide{display:none!important}
.view{animation:in .38s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(12px)}}
h1{font:700 42px/1 var(--hd);letter-spacing:-.025em;margin:0 0 22px}
.sec{font:600 14px var(--bd);color:var(--mu);margin:26px 4px 8px}
.lay{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
.list{background:var(--p);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 18px;background:none;border:0;border-top:1px solid var(--ln);cursor:pointer;transition:background .15s;animation:in .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
.row:first-child{border-top:0}.row:hover{background:var(--lt)}.row:active{background:#e2e8ee}
.row .go{margin-left:auto;color:var(--mu);transition:transform .2s}.row:hover .go{transform:translateX(4px);color:var(--ink)}
.row .av{width:44px;height:44px;border-radius:14px}
.tile{flex:none;width:44px;height:44px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center}.tile.ac{background:var(--ac)}
.bt{display:grid;line-height:1.3;min-width:0}.bt small{color:var(--mu);font-size:14px}.bt b{font-weight:600}
.rt{margin-left:auto;font:700 16px var(--hd);color:var(--mu)}.rt+.go{margin-left:6px}
.seg{display:inline-grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;border-radius:14px;background:rgba(15,26,36,.08);margin:0 0 10px 4px}
.seg button{font:600 14px var(--bd);color:var(--mu);background:none;border:0;border-radius:11px;padding:7px 16px;cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--p);color:var(--ink);box-shadow:0 1px 2px rgba(15,26,36,.15)}
.prof{background:var(--p);border:1px solid var(--ln);border-radius:var(--r);padding:22px;display:grid;gap:14px;position:sticky;top:84px}
.big{font:700 68px/1 var(--hd);letter-spacing:-.03em}.cap{color:var(--mu);font-size:14px;margin-top:-8px}
label{font-size:14px;color:var(--mu)}
input{font:500 16px var(--bd);color:var(--ink);background:var(--lt);border:1px solid transparent;border-radius:12px;padding:10px 12px;width:100%}
input:focus{border-color:var(--ac);outline:0;background:#fff}
.rec{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.rec b{display:block;font:700 22px var(--hd)}.rec span{font-size:13px;color:var(--mu)}
.note{margin:0;font-size:13px;color:var(--mu)}
.spark{width:100%;height:46px}.spark polyline{fill:none;stroke:var(--ac);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.chip{flex:none;width:58px;text-align:center;font:700 13px var(--bd);padding:4px 0;border-radius:9px}
.chip.win{background:#d6f1e4;color:#0e6b47}.chip.loss{background:#fadadd;color:#9b2431}.chip.draw{background:#e4e8ec;color:#46525e}
.dl{font:700 15px var(--hd);min-width:42px;text-align:right}.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}
.hcol{color:var(--mu);font-size:14px;min-width:70px;text-align:right}
.empty{padding:40px 22px;text-align:center;color:var(--mu);display:grid;gap:14px;justify-items:center}
/* find */
.findbox{min-height:calc(100dvh - 170px);display:grid;place-content:center;justify-items:center;text-align:center;gap:8px}
.radar{position:relative;width:240px;height:240px;display:grid;place-items:center}
.radar i{position:absolute;inset:0;border:2px solid var(--ac);border-radius:50%;opacity:0;animation:ring 2.7s cubic-bezier(.2,.6,.3,1) infinite}
.radar i:nth-child(2){animation-delay:.9s}.radar i:nth-child(3){animation-delay:1.8s}
@keyframes ring{0%{transform:scale(.36);opacity:.75}100%{transform:scale(1.1);opacity:0}}
.findbox h2{font:700 32px/1.1 var(--hd);letter-spacing:-.02em;margin:6px 0 0}.findbox p{margin:0;color:var(--mu);max-width:36ch}
.ftime{font:700 26px var(--hd);margin-top:4px}
.linkbox{display:flex;gap:8px;margin:10px 0 4px;width:min(92vw,420px)}
.vs{display:flex;align-items:center;gap:28px;margin-bottom:8px}.vp{display:grid;justify-items:center;gap:4px;animation:sl .6s cubic-bezier(.2,.8,.2,1) backwards}
.vp.b{animation-name:sr}.vp b{font:700 20px var(--hd)}.vp small{color:var(--mu)}.vx{font:700 22px var(--hd);color:var(--mu);animation:pop .5s .3s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes sl{from{opacity:0;transform:translateX(-60px)}}@keyframes sr{from{opacity:0;transform:translateX(60px)}}@keyframes pop{from{opacity:0;transform:scale(.3)}}
/* board */
.gwrap,.rvw{display:flex;gap:20px;justify-content:center;align-items:flex-start}
.bcol{width:calc(var(--s) + 22px);display:grid;gap:10px}
.frame{padding:10px;background:var(--p);border:1px solid var(--ln);border-radius:26px}
.bd{width:var(--s);height:var(--s);display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);border-radius:16px;overflow:hidden;user-select:none;touch-action:manipulation}
.sq{position:relative;display:grid;place-items:center;cursor:pointer}.rvw .sq{cursor:default}
.sq.l{background:var(--lt)}.sq.d{background:var(--dk)}
.sq.last::before{content:"";position:absolute;inset:0;background:rgba(255,208,0,.5)}
.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(37,64,255,.38)}
.sq.chk{box-shadow:inset 0 0 0 calc(var(--s)/60) var(--bad)}
.sq.tg::after{content:"";position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(15,26,36,.26);animation:dot .18s ease-out backwards}@keyframes dot{from{transform:scale(0)}}
.sq.tg.cap::after{width:94%;height:94%;background:none;box-shadow:inset 0 0 0 calc(var(--s)/34) rgba(15,26,36,.28)}
.pc{width:88%;height:88%;position:relative;z-index:1;filter:drop-shadow(0 2px 1px rgba(15,26,36,.3));pointer-events:none}
.co{position:absolute;z-index:2;font:700 calc(var(--s)/46) var(--bd);pointer-events:none;opacity:.8}.co.r{left:5%;top:4%}.co.f{right:6%;bottom:3%}.l .co{color:var(--dk)}.d .co{color:var(--lt)}
.pw{fill:#fff;stroke:#1c2733;stroke-width:1.7;stroke-linejoin:round}.pb{fill:#25313f;stroke:#0c141c;stroke-width:1.7;stroke-linejoin:round}
.pw .dt{fill:none;stroke:#1c2733;stroke-linecap:round;stroke-width:1.6}.pb .dt{fill:none;stroke:#cdd6df;stroke-linecap:round;stroke-width:1.6}.dt.x{stroke-width:2.6!important}
.pl{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;background:var(--p);border:1px solid var(--ln);border-radius:18px;transition:border-color .2s}
.pl.on{border-color:var(--ac)}.pl.on .av{box-shadow:0 0 0 2px var(--p),0 0 0 4px var(--ac)}.pl .av{transition:box-shadow .2s}
.who{flex:1;display:grid;line-height:1.25;min-width:0}.who b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who b i{font-style:normal;color:var(--mu);font-weight:500;margin-left:6px}
.cp{display:flex;height:16px}.cp svg{width:17px;height:17px;margin-right:-6px}.adv{font-weight:700;color:var(--mu);font-size:14px}
.side{width:300px;background:var(--p);border:1px solid var(--ln);border-radius:var(--r);padding:20px;display:grid;gap:14px}
#status{font:700 24px/1.15 var(--hd);letter-spacing:-.01em}#info{color:var(--mu);font-size:14px}
.moves{background:var(--lt);border-radius:14px;padding:8px 10px;height:210px;overflow:auto;display:grid;grid-template-columns:2.4em 1fr 1fr;gap:2px 4px;align-content:start;font-size:14px;position:relative}
.moves>span{color:var(--mu);padding:3px 0}.moves>div{padding:3px 6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* review */
.evb{position:relative;width:24px;height:var(--s);margin-top:11px;background:#25313f;border-radius:12px;overflow:hidden}
.evf{position:absolute;left:0;right:0;background:#fff;transition:height .4s cubic-bezier(.2,.8,.2,1)}.evb.w .evf{bottom:0}.evb.b .evf{top:0}
.evb em{position:absolute;left:0;right:0;font:700 10px var(--bd);text-align:center;font-style:normal}.evb.w em{bottom:4px;color:#25313f}.evb.b em{top:4px;color:#25313f}
.rside{width:340px;display:grid;gap:12px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:var(--r);padding:16px}
.sum{display:grid;gap:2px}.sr{display:grid;grid-template-columns:1fr 70px 70px;gap:6px;align-items:center;padding:3px 0;font-size:14px}.sr b{text-align:right;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sr.h{color:var(--mu);border-bottom:1px solid var(--ln);padding-bottom:6px;margin-bottom:4px}
.sr.acc b{font:700 22px var(--hd)}
.dotc{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:8px}
.c-best{--c:var(--ok)}.c-good{--c:#7cb342}.c-inaccuracy{--c:var(--warn)}.c-mistake{--c:#e8710a}.c-blunder{--c:var(--bad)}
.graph{width:100%;height:70px;display:block;border-radius:12px;cursor:pointer}.gb{fill:#25313f}.ga{fill:#fff}.gl{stroke:var(--ac);stroke-width:2;vector-effect:non-scaling-stroke}
.now{display:grid;gap:2px}.now b{font:700 20px var(--hd)}.now small{color:var(--mu);font-size:14px}
.mv{font:500 14px var(--bd);background:none;border:0;border-radius:8px;padding:3px 6px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:6px}.mv:hover{background:#fff}.mv.on{background:var(--ac);color:#fff}
.mv::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,transparent);flex:none}
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ctl .btn{padding:12px 0}
.prg{height:8px;border-radius:6px;background:var(--lt);overflow:hidden;margin:10px 0 6px}.prg i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
/* dialogs */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(15,26,36,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:18px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dlg{width:min(92vw,380px);padding:26px;display:grid;gap:12px;text-align:center;background:var(--p);border-radius:28px;box-shadow:0 30px 80px rgba(15,26,36,.28);animation:dlg .38s cubic-bezier(.34,1.5,.64,1)}
@keyframes dlg{from{opacity:0;transform:scale(.88) translateY(14px)}}
.dlg h3{font:700 32px/1.1 var(--hd);letter-spacing:-.02em;margin:0}.dlg p{margin:0;color:var(--mu)}.dlg .row2{display:grid;gap:8px;margin-top:4px}
.rrow{display:flex;justify-content:center;align-items:baseline;gap:10px;background:var(--lt);border-radius:14px;padding:12px;margin:4px 0}.rrow span{color:var(--mu);font-size:14px}.rrow b{font:700 28px var(--hd)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pk{padding:6px}.pk svg{width:100%}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:40;background:rgba(15,26,36,.86);color:#fff;backdrop-filter:blur(12px);padding:12px 18px;border-radius:16px;max-width:90vw;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
@media(max-width:900px){.lay{grid-template-columns:1fr}.prof{position:static;order:-1}.gwrap,.rvw{flex-direction:column;align-items:center}.side,.rside{width:calc(var(--s) + 22px)}.moves{height:120px}
 .rvw{flex-direction:column}.evb{width:var(--s);height:18px;margin:0}.evb em{display:none}.evf{top:0!important;bottom:auto!important;height:100%!important;width:var(--w);right:auto;transition:width .4s}.evb.w .evf,.evb.b .evf{left:0}
 .pn,.hcol.d{display:none}h1{font-size:34px}:root{--s:min(calc(100vw - 48px),calc(100dvh - 290px),640px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<header><div class="hdin">
 <button class="brand" id="home"><span class="logo"><svg viewBox="0 0 45 45"><use href="#wr"/></svg></span>Rookery</button>
 <nav id="nav"><button data-v="menu" class="on">Play</button><button data-v="hist">History</button></nav>
 <button class="back hide" id="back"></button>
 <button class="mepill" id="mePill" aria-label="Your profile"></button>
</div></header>
<main>
<section id="menu"><h1>Play</h1><div class="lay"><div>
  <div class="sec" style="margin-top:0">Against people</div>
  <div class="list">
   <button class="row" id="quick" style="--i:0"><span class="tile ac" id="icQ"></span><span class="bt"><b>Find an opponent</b><small>Match with another player who is searching</small></span><span class="go" id="goQ"></span></button>
   <button class="row" id="invite" style="--i:1"><span class="tile" id="icI"></span><span class="bt"><b>Invite a friend</b><small>Get a link to send them</small></span><span class="go" id="goI"></span></button>
  </div>
  <div class="sec">Against bots</div>
  <div class="seg" id="seg"><button data-c="w">White</button><button data-c="r" class="on">Random</button><button data-c="b">Black</button></div>
  <div class="list" id="bots"></div>
 </div>
 <aside class="prof"><div><div class="big" id="pElo">800</div></div><div class="cap">Your rating</div>
  <div><label for="nm">Name</label><input id="nm" maxlength="20" autocomplete="off"></div>
  <div class="rec"><div><b id="pW">0</b><span>Wins</span></div><div><b id="pD">0</b><span>Draws</span></div><div><b id="pL">0</b><span>Losses</span></div><div><b id="pP">800</b><span>Peak</span></div></div>
  <svg class="spark hide" id="spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points=""/></svg>
  <p class="note">Guest ratings are saved in this browser only. Clearing site data resets them.</p>
 </aside></div></section>
<section id="hist" class="hide"><h1>History</h1><div class="list" id="hlist"></div></section>
<section id="find" class="hide"><div class="findbox">
  <div class="radar" id="radar"><i></i><i></i><i></i><span class="av xl" id="fMe"></span></div>
  <div class="vs hide" id="vs"><div class="vp"><span class="av xl" id="vsA"></span><b id="vsAn"></b><small id="vsAr"></small></div><span class="vx">vs</span><div class="vp b"><span class="av xl" id="vsB"></span><b id="vsBn"></b><small id="vsBr"></small></div></div>
  <h2 id="fTitle"></h2><p id="fSub"></p><div class="ftime" id="fTime">0:00</div><div id="fAct"></div>
  <button class="btn" id="fCancel" style="margin-top:12px">Cancel</button>
</div></section>
<section id="game" class="hide"><div class="gwrap">
  <div class="bcol"><div class="pl" id="pTop"></div><div class="frame"><div class="bd" id="board" role="grid" aria-label="Chess board"></div></div><div class="pl" id="pBot"></div></div>
  <aside class="side"><div id="status" aria-live="polite"></div><div id="info"></div><div class="moves" id="moves"></div>
   <div class="acts"><button class="btn" id="flip"></button><button class="btn" id="resign"></button></div></aside>
</div></section>
<section id="review" class="hide"><div class="rvw">
  <div class="evb w" id="evb"><div class="evf"></div><em></em></div>
  <div class="bcol"><div class="pl" id="rTop"></div><div class="frame"><div class="bd" id="rBoard"></div></div><div class="pl" id="rBot"></div></div>
  <aside class="rside" id="rSide"></aside>
</div></section>
</main>
<div class="modal hide" id="modal"><div class="dlg" id="dlg"></div></div>
<div id="toast" role="status"></div>
<script data-cfasync="false">
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM_=matchMedia('(prefers-reduced-motion:reduce)').matches;
/* ---------- icons + original piece set ---------- */

async function invite(){closeNet();const my=tok,code=Math.random().toString(36).slice(2,8);showFind('Waiting for your friend','Send them this link and keep this tab open.');
 const p=await mk('rky-r-'+code);if(my!=tok){p&&p.destroy();return}if(!p)return fail('Could not reach the connection service. Check your internet.');
 peer=p;location.hash='r='+code;$('#fAct').innerHTML=`<div class="linkbox"><input readonly value="${location.href}" aria-label="Invite link"><button class="btn" id="copy">Copy</button></div>`;
 $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('#copy').textContent='Copied'}catch{$('#fAct input').select()}};
 p.on('connection',c=>{if(conn)return c.close();setup(c,'w')})}
async function joinInvite(code){closeNet();const my=tok;showFind('Joining game','Connecting to your friend…');const p=await mk();if(my!=tok)return;if(!p)return fail('Could not reach the connection service.');
 peer=p;const c=await dial(p,'rky-r-'+code);if(my!=tok)return;if(!c)return fail('That game isn’t available. The host may have closed the page.');setup(c,'b')}
$('#quick').onclick=quick;$('#invite').onclick=invite;$('#fCancel').onclick=toMenu;
/* ---------- game review ---------- */
const LBL={best:'Best move',good:'Good move',inaccuracy:'Inaccuracy',mistake:'Mistake',blunder:'Blunder'},ANN={inaccuracy:'?!',mistake:'?',blunder:'??'};
const fmt=e=>Math.abs(e)>=90000?(e>0?'Mate for White':'Mate for Black'):(e>=0?'+':'')+(e/100).toFixed(1);
async function openReview(g){const st=[start()],mvs=[],sn=[];
 for(const[f,t,p]of g.moves){const s=st[st.length-1],m=legal(s).find(x=>x.f==f&&x.t==t&&(x.p||'')==(p||''));sn.push(san(s,m));mvs.push(m);st.push(apply(s,m))}
 rv={g,ply:0,st,mvs,sn,view:g.me,res:g.review,dir:0};go('review');drawReview();
 if(!rv.res){const me_=rv;const r=await job({k:'review',moves:g.moves},p=>{const e=$('#prg');if(e&&rv==me_)e.style.width=(p*100|0)+'%'});if(rv!==me_)return;g.review=r;rv.res=r;saveG();rv.ply=Math.max(0,r.pl.findIndex((p,i)=>p.c=='blunder'&&(i%2==0)==(g.me=='w'))+1);drawReview()}}
function drawReview(){const g=rv.g,r=rv.res,st=rv.st[rv.ply],lm=rv.ply?rv.mvs[rv.ply-1]:null,you=g.me,them=opp(you);
 drawBoard($('#rBoard'),st,{view:rv.view,last:lm,anim:rv.dir>0,ck:inCheck(st,st.turn)?kingSq(st,st.turn):-1});rv.dir=0;
 const nm=c=>c==you?prof.name:g.opp;bar($('#rTop'),opp(rv.view),st,{n:nm,x:c=>r?r.acc[c]+'%':''});bar($('#rBot'),rv.view,st,{n:nm,x:c=>r?r.acc[c]+'%':''});
 const ev=r?r.ev[rv.ply]:0,w=r?win(ev):50,eb=$('#evb');eb.className='evb '+rv.view;eb.firstElementChild.style.cssText=`height:${w}%;--w:${w}%`;eb.lastElementChild.textContent=r?(Math.abs(ev)>=90000?'M':(Math.abs(ev)/100).toFixed(1)):'';
 let h=`<div class="card"><b style="font:700 20px var(--hd)">${esc(g.opp)}</b><br><span class="chip ${g.result}" style="display:inline-block;margin-top:6px">${{win:'Win',loss:'Loss',draw:'Draw'}[g.result]}</span> <small style="color:var(--mu)">${esc(g.text)}</small></div>`;
 if(!r)h+=`<div class="card"><b>Analysing your game</b><div class="prg"><i id="prg"></i></div><small style="color:var(--mu)">Checking every move with the built-in engine.</small></div>`;
 else{const row=(l,k)=>`<div class="sr"><span><span class="dotc c-${k}"></span>${l}</span><b>${r.cnt[you][k]}</b><b>${r.cnt[them][k]}</b></div>`;
  h+=`<div class="card sum"><div class="sr h"><span></span><b>You</b><b>${esc(g.opp)}</b></div><div class="sr acc"><span>Accuracy</span><b>${r.acc[you]}%</b><b>${r.acc[them]}%</b></div>${row('Best','best')}${row('Good','good')}${row('Inaccuracies','inaccuracy')}${row('Mistakes','mistake')}${row('Blunders','blunder')}</div>`;
  const n=r.ev.length,W=300,H=70,pts=r.ev.map((e,i)=>`${i/(n-1||1)*W},${H-win(e)/100*H}`),x=rv.ply/(n-1||1)*W;
  h+=`<div class="card" style="padding:10px"><svg class="graph" id="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><rect class="gb" width="${W}" height="${H}"/><path class="ga" d="M0,${H} L${pts.join(' L')} L${W},${H}Z"/><line class="gl" x1="${x}" x2="${x}" y1="0" y2="${H}"/></svg></div>`;
  const pl=rv.ply?r.pl[rv.ply-1]:null;
  h+=`<div class="card now c-${pl?pl.c:'good'}">${pl?`<b><span class="dotc c-${pl.c}"></span>${rv.sn[rv.ply-1]}${ANN[pl.c]||''}: ${LBL[pl.c]}</b><small>${pl.c=='best'||pl.c=='good'?'':'Better was '+pl.bs+'. '}Evaluation ${fmt(ev)}</small>`:`<b>Starting position</b><small>Step through the game or tap a move. Evaluation ${fmt(ev)}</small>`}</div>`;
  let mv='';rv.sn.forEach((s,i)=>{if(i%2==0)mv+=`<span>${i/2+1}.</span>`;const c=r.pl[i].c;mv+=`<button class="mv c-${c} ${i+1==rv.ply?'on':''}" data-p="${i+1}">${s}${ANN[c]||''}</button>`});
  h+=`<div class="moves" id="rmoves" style="height:150px">${mv}</div>`}
 h+=`<div class="ctl"><button class="btn" data-s="first" aria-label="Start">${ic('first')}</button><button class="btn" data-s="prev" aria-label="Previous move">${ic('prev')}</button><button class="btn" data-s="next" aria-label="Next move">${ic('next')}</button><button class="btn" data-s="last" aria-label="End">${ic('last')}</button></div><button class="btn" id="rflip">${ic('flip',18)}Flip board</button><p class="note">Analysis comes from Rookery’s own shallow engine. Treat it as a guide, not a verdict.</p>`;
 $('#rSide').innerHTML=h;const gr=$('#graph');if(gr)gr.onclick=e=>{const b=gr.getBoundingClientRect();step(Math.round((e.clientX-b.left)/b.width*(rv.res.ev.length-1)))};
 const ml=$('#rmoves'),on=ml&&ml.querySelector('.on');if(on)ml.scrollTop=on.offsetTop-ml.clientHeight/2;
 $('#rflip').onclick=()=>{rv.view=opp(rv.view);drawReview()}}
function step(p){if(!rv)return;p=Math.max(0,Math.min(rv.g.moves.length,p));rv.dir=p==rv.ply+1?1:0;rv.ply=p;drawReview()}
$('#rSide').onclick=e=>{const s=e.target.closest('[data-s]')?.dataset.s,m=e.target.closest('[data-p]');if(m)step(+m.dataset.p);else if(s)step({first:0,prev:rv.ply-1,next:rv.ply+1,last:1e3}[s])};
addEventListener('keydown',e=>{if(cur!='review'||/INPUT/.test(e.target.tagName))return;const k={ArrowLeft:rv.ply-1,ArrowRight:rv.ply+1,Home:0,End:1e3}[e.key];if(k!=null){e.preventDefault();step(k)}});
pill();if(/^#r=[\w-]+$/.test(location.hash))joinInvite(location.hash.slice(3));else renderMenu();
</script></body></html>
